org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Parallel execution stays OFF for this project, for two independent reasons:
#  1) There is a single module, so parallelism buys almost nothing.
#  2) With org.gradle.parallel=true, AGP 8.7 + KGP 2.0.21 fail the moment unit-test sources exist:
#     ':app:compileDebugKotlin' dies evaluating 'friendPathsSet$kotlin_gradle_plugin_common' with
#     "Current thread does not hold the state lock for root project".
org.gradle.parallel=false

org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
